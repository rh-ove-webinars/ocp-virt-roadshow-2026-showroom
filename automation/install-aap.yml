---
# One-time setup: install the Ansible Automation Platform Automation Controller operator
# on the shared roadshow cluster, and stand up a standalone AutomationController instance.
#
# Run this ONCE, before the lab, by someone with cluster-admin access:
#   oc login <cluster-api-url> -u kubeadmin ...
#   ansible-playbook install-aap.yml
#
# Only the Controller component is installed (not the full AnsibleAutomationPlatform CR
# with Hub/EDA) -- this lab only needs orgs, credentials, inventories and job templates,
# and the cluster is already busy hosting ODF and 20 attendees' VMs.
- name: Install Ansible Automation Platform (Automation Controller only)
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Create the AAP namespace/project
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ aap_namespace }}"

    - name: Create OperatorGroup for the AAP operator
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: aap-operator-group
            namespace: "{{ aap_namespace }}"
          spec:
            targetNamespaces:
              - "{{ aap_namespace }}"

    - name: Subscribe to the AAP operator
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: ansible-automation-platform-operator
            namespace: "{{ aap_namespace }}"
          spec:
            channel: "{{ aap_operator_channel }}"
            name: ansible-automation-platform-operator
            source: redhat-operators
            sourceNamespace: openshift-marketplace
            installPlanApproval: Automatic

    - name: Wait for the AAP operator CSV to succeed
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: "{{ aap_namespace }}"
      register: csv_info
      until: >
        csv_info.resources | selectattr('metadata.name', 'search', '^aap-operator')
        | selectattr('status.phase', 'defined') | map(attribute='status.phase') | list
        == (csv_info.resources | selectattr('metadata.name', 'search', '^aap-operator') | list | length) * ['Succeeded']
      retries: 60
      delay: 30
      when: csv_info.resources | selectattr('metadata.name', 'search', '^aap-operator') | list | length > 0

    - name: Create the standalone AutomationController instance
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: automationcontroller.ansible.com/v1beta1
          kind: AutomationController
          metadata:
            name: "{{ aap_controller_name }}"
            namespace: "{{ aap_namespace }}"
          spec:
            replicas: 1
            route_tls_termination_mechanism: Edge

    - name: Wait for the AutomationController deployment to be ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ aap_controller_name }}"
        namespace: "{{ aap_namespace }}"
      register: controller_deploy
      until: >
        controller_deploy.resources | length > 0 and
        (controller_deploy.resources[0].status.readyReplicas | default(0)) >= 1
      retries: 60
      delay: 30

    - name: Look up the Controller route
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        name: "{{ aap_controller_name }}"
        namespace: "{{ aap_namespace }}"
      register: controller_route

    - name: Read the generated admin password secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ aap_controller_name }}-admin-password"
        namespace: "{{ aap_namespace }}"
      register: controller_admin_secret

    - name: Ensure the generated-secrets directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/.generated"
        state: directory
        mode: "0700"

    - name: Save connection details for configure-controller.yml to pick up automatically
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/.generated/controller-connection.yml"
        mode: "0600"
        content: |
          ---
          controller_host: "https://{{ controller_route.resources[0].spec.host }}"
          controller_password: "{{ controller_admin_secret.resources[0].data.password | b64decode }}"
      no_log: true

    - name: Show connection details
      ansible.builtin.debug:
        msg:
          - "Controller URL: https://{{ controller_route.resources[0].spec.host }}"
          - "Saved to .generated/controller-connection.yml -- configure-controller.yml will"
          - "load it automatically. You still need to pass lab_password yourself, e.g.:"
          - "  ansible-playbook configure-controller.yml -e lab_password='<shared OCP lab password>'"
