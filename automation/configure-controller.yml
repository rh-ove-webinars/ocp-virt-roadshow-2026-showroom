---
# Idempotent: configures the AAP gateway (organizations/users/roles) and each org's two
# Controller-side credentials, after install-aap.yml has the platform running. Safe to
# re-run any time, e.g. to refresh attendees' OpenShift OAuth tokens (see
# ocp_user_token_map below) shortly before the event.
#
#   ansible-playbook configure-controller.yml \
#     -e aap_host=https://aap-aap.apps.<cluster-domain> \
#     -e aap_admin_password='<from install-aap.yml output>' \
#     -e lab_password='<shared OpenShift password attendees already use>'
#
# Deliberately does NOT create a Project/Inventory/Job Template -- attendees build those
# themselves in Module 8, using the "VM SSH Key" and "OpenShift Access" credentials this
# playbook provisions. See automation/README.md and
# content/modules/ROOT/pages/module-08-aap.adoc.
#
# AAP 2.5+ centralizes Organizations/Users/role-assignments in the gateway
# (/api/gateway/v1/...), not Controller -- Controller-specific objects (credentials,
# projects, inventories, job templates) are configured through the gateway's proxied
# Controller API (/api/controller/v2/...), using the SAME gateway admin credentials for
# both. See automation/README.md for how this was verified against the live cluster.
#
# Requires: an active `oc login` session as an admin who can read every attendee's password
# (only needed transiently, to log in AS each attendee and mint a token for AAP -- see the
# "Key design choice" note in the project plan for why this is done instead of ServiceAccounts).
- name: Configure AAP organizations, users and credentials
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aap_admin_username: admin
    aap_validate_certs: false
    gateway_api: "{{ aap_host }}/api/gateway/v1"
    controller_api: "{{ aap_host }}/api/controller/v2"
    lab_users: "{{ range(1, lab_user_count + 1) | map('string') | map('regex_replace', '^(.*)$', lab_user_prefix + '\\1') | list }}"

  tasks:
    - name: Check for connection details saved by install-aap.yml
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/.generated/controller-connection.yml"
      register: _saved_connection

    - name: Load connection details saved by install-aap.yml, if present and not overridden
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/.generated/controller-connection.yml"
      when: _saved_connection.stat.exists and (aap_host is not defined or aap_admin_password is not defined)

    - name: Require required run-time variables
      ansible.builtin.assert:
        that:
          - aap_host is defined
          - aap_admin_password is defined
          - lab_password is defined
        fail_msg: >
          Missing required -e vars. See the header of this file for the exact command.

    # --- Shared lab-wide SSH keypair, used as every org's Machine credential -------------
    - name: Ensure the generated-secrets directory exists
      ansible.builtin.file:
        path: "{{ aap_ssh_keypair_dir }}"
        state: directory
        mode: "0700"

    - name: Generate the lab SSH keypair if it doesn't already exist
      ansible.builtin.command: >
        ssh-keygen -t ed25519 -N "" -C "aap-roadshow-lab" -f {{ aap_ssh_private_key_path }}
      args:
        creates: "{{ aap_ssh_private_key_path }}"

    - name: Read the generated keys
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ aap_ssh_private_key_path }}"
        - "{{ aap_ssh_public_key_path }}"
      register: aap_ssh_keys
      no_log: true

    - name: Set key facts
      ansible.builtin.set_fact:
        aap_ssh_private_key: "{{ aap_ssh_keys.results[0].content | b64decode }}"
        aap_ssh_public_key: "{{ aap_ssh_keys.results[1].content | b64decode }}"
      no_log: true

    # --- One OAuth token per attendee, from their own OpenShift identity ----------------
    # This works even though attendees' namespaces (vmexamples-userN) don't exist yet --
    # identity/login is independent of the namespaces that identity will later create.
    # Tokens from `oc login` use the built-in client and expire after the cluster-wide default
    # (often 24h). A dedicated OAuthClient can carry its own accessTokenMaxAgeSeconds, so tokens
    # requested through it live as long as aap_token_lifetime_seconds.
    - name: Find the cluster's OAuth server route
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        namespace: openshift-authentication
        name: oauth-openshift
      register: oauth_route

    - name: Set the OAuth server host
      ansible.builtin.set_fact:
        oauth_host: "{{ oauth_route.resources[0].spec.host }}"

    - name: Create an OAuth client that issues long-lived tokens
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: oauth.openshift.io/v1
          kind: OAuthClient
          metadata:
            name: "{{ aap_oauth_client_name }}"
          grantMethod: auto
          respondWithChallenges: true
          accessTokenMaxAgeSeconds: "{{ aap_token_lifetime_seconds | int }}"
          redirectURIs:
            - "https://{{ oauth_host }}/oauth/token/implicit"

    - name: Request a long-lived token as each attendee
      ansible.builtin.uri:
        url: "https://{{ oauth_host }}/oauth/authorize?client_id={{ aap_oauth_client_name }}&response_type=token"
        url_username: "{{ item }}"
        url_password: "{{ lab_password }}"
        force_basic_auth: true
        headers:
          X-CSRF-Token: "1"
        follow_redirects: none
        validate_certs: false
        status_code: 302
      loop: "{{ lab_users }}"
      register: ocp_user_tokens
      no_log: true

    - name: Check that every token was issued with the requested lifetime
      ansible.builtin.assert:
        that:
          - "'access_token=' in item.location"
          - "(item.location | regex_search('expires_in=([0-9]+)', '\\1') | first | int) >= (aap_token_lifetime_seconds | int) - 60"
        fail_msg: "{{ item.item }}: OAuth server did not return a token with the requested lifetime"
        quiet: true
      loop: "{{ ocp_user_tokens.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Map attendee usernames to their OAuth tokens
      ansible.builtin.set_fact:
        ocp_user_token_map: "{{ dict(lab_users | zip(ocp_user_tokens.results | map(attribute='location') | map('regex_search', 'access_token=([^&]+)', '\\1') | map('first'))) }}"
      no_log: true

    # --- Gateway-level lookups (looked up once, reused for all 20 orgs) -----------------
    - name: Look up the gateway's "Organization Admin" role definition id
      ansible.builtin.uri:
        url: "{{ gateway_api }}/role_definitions/?name={{ 'Organization Admin' | urlencode }}"
        url_username: "{{ aap_admin_username }}"
        url_password: "{{ aap_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
      register: org_admin_role

    - name: Look up the built-in "Machine" credential type id
      ansible.builtin.uri:
        url: "{{ controller_api }}/credential_types/?name=Machine"
        url_username: "{{ aap_admin_username }}"
        url_password: "{{ aap_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
      register: machine_cred_type

    - name: Look up the built-in "OpenShift or Kubernetes API Bearer Token" credential type id
      ansible.builtin.uri:
        url: "{{ controller_api }}/credential_types/?name={{ 'OpenShift or Kubernetes API Bearer Token' | urlencode }}"
        url_username: "{{ aap_admin_username }}"
        url_password: "{{ aap_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
      register: k8s_cred_type

    - name: Set shared fact ids
      ansible.builtin.set_fact:
        org_admin_role_definition_id: "{{ org_admin_role.json.results[0].id }}"
        machine_credential_type_id: "{{ machine_cred_type.json.results[0].id }}"
        k8s_credential_type_id: "{{ k8s_cred_type.json.results[0].id }}"

    # --- Per-attendee Organization / User / Role / Credentials / Project / Inventory / JT -
    - name: Configure each attendee's organization, user and credentials
      ansible.builtin.include_tasks: tasks/configure_user.yml
      loop: "{{ lab_users }}"
      loop_control:
        label: "{{ item }}"
