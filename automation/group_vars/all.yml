---
# Number of lab attendees / AAP organizations to provision.
lab_user_count: 20
lab_user_prefix: user

# Namespace the AAP operator and the unified AnsibleAutomationPlatform instance are
# installed into. Deploying the unified platform CR (not a standalone AutomationController)
# is what gets attendees the AAP gateway UI/login.
aap_namespace: aap
aap_operator_channel: stable-2.7
aap_platform_name: aap

# Reference values only -- not consumed by configure-controller.yml itself (attendees enter
# these by hand into the AAP UI in Module 8 when they build their own Project/Inventory
# Source/Job Template). Kept here as the canonical source of truth so the lab guide and this
# playbook can't drift apart. Points at the rh-ove-webinars org's fork (not upstream
# rhpds/ocp-virt-roadshow-2026-showroom) so this content can be iterated on independently.
aap_content_repo_url: "https://github.com/rh-ove-webinars/ocp-virt-roadshow-2026-showroom.git"
aap_content_repo_branch: main
aap_content_playbook_path: "automation/vm-content/playbooks/patch-vm.yml"

# Shared SSH keypair used for every org's Machine credential. Generated once by
# configure-controller.yml if it doesn't already exist, and gitignored -- never commit
# real key material.
aap_ssh_keypair_dir: "{{ playbook_dir }}/.generated"
aap_ssh_private_key_path: "{{ aap_ssh_keypair_dir }}/aap_lab_id_rsa"
aap_ssh_public_key_path: "{{ aap_ssh_keypair_dir }}/aap_lab_id_rsa.pub"

# lab_password (the shared OpenShift password every attendee already has) is intentionally
# NOT set here. Pass it at run time, e.g.:
#   ansible-playbook configure-controller.yml -e lab_password=Sup3rSecret --ask-vault-pass
# or store it in an ansible-vault encrypted group_vars/vault.yml and gitignore that file too.
