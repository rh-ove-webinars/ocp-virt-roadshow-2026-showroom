---
# Dynamic inventory: discovers OpenShift Virtualization VMs as Ansible hosts.
#
# Synced by Automation Controller as an SCM-sourced Inventory Source (see
# automation/tasks/configure_user.yml). Deliberately has no `namespaces:` filter -- every
# attendee's Inventory Source is linked to a Bearer Token credential that IS that attendee's
# own OpenShift identity, so the API server itself only ever returns the VMs in namespaces
# that attendee can see (their own vmexamples-userN project). This is the same file, unchanged,
# for all 20 organizations.
plugin: kubernetes.core.k8s
connections:
  - kind: VirtualMachineInstance
    api_version: kubevirt.io/v1
compose:
  ansible_host: status.interfaces[0].ipAddress | default(omit)
  ansible_user: "'fedora'"
