---
# Included once per attendee username (available as `item`, e.g. "user7") by
# configure-controller.yml. Idempotently ensures that attendee's Organization, User, role
# assignment (all at the AAP gateway level), and their two Controller-side credentials (via
# the gateway's proxied Controller API) exist.
#
# Deliberately stops there: Module 8 has attendees build the Project, Inventory (+ Source)
# and Job Template themselves using these credentials, rather than everything being
# pre-built for them -- that hands-on configuration is the point of the module.
#
# All API calls use name-filtered GET-then-create-if-missing so this is safe to re-run.

- name: "{{ item }} / find Organization (gateway)"
  ansible.builtin.uri:
    url: "{{ gateway_api }}/organizations/?name={{ item | urlencode }}"
    url_username: "{{ aap_admin_username }}"
    url_password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
  register: _org_get

- name: "{{ item }} / create Organization (gateway)"
  ansible.builtin.uri:
    url: "{{ gateway_api }}/organizations/"
    method: POST
    url_username: "{{ aap_admin_username }}"
    url_password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
    body_format: json
    body:
      name: "{{ item }}"
      description: "OCP Virt Roadshow attendee organization"
    status_code: 201
  register: _org_create
  when: _org_get.json.count == 0

- name: "{{ item }} / set gateway_org_id"
  ansible.builtin.set_fact:
    gateway_org_id: "{{ _org_get.json.results[0].id if _org_get.json.count > 0 else _org_create.json.id }}"

- name: "{{ item }} / find User (gateway)"
  ansible.builtin.uri:
    url: "{{ gateway_api }}/users/?username={{ item | urlencode }}"
    url_username: "{{ aap_admin_username }}"
    url_password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
  register: _user_get

- name: "{{ item }} / create User (gateway)"
  ansible.builtin.uri:
    url: "{{ gateway_api }}/users/"
    method: POST
    url_username: "{{ aap_admin_username }}"
    url_password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
    body_format: json
    body:
      username: "{{ item }}"
      password: "{{ lab_password }}"
      is_superuser: false
    status_code: 201
  register: _user_create
  no_log: true
  when: _user_get.json.count == 0

- name: "{{ item }} / set gateway_user_id"
  ansible.builtin.set_fact:
    gateway_user_id: "{{ _user_get.json.results[0].id if _user_get.json.count > 0 else _user_create.json.id }}"

- name: "{{ item }} / find existing Organization Admin role assignment"
  ansible.builtin.uri:
    url: "{{ gateway_api }}/role_user_assignments/?user={{ gateway_user_id }}&role_definition={{ org_admin_role_definition_id }}&object_id={{ gateway_org_id }}"
    url_username: "{{ aap_admin_username }}"
    url_password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
  register: _role_assignment_get

- name: "{{ item }} / grant the user Organization Admin on their organization"
  ansible.builtin.uri:
    url: "{{ gateway_api }}/role_user_assignments/"
    method: POST
    url_username: "{{ aap_admin_username }}"
    url_password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
    body_format: json
    body:
      role_definition: "{{ org_admin_role_definition_id }}"
      user: "{{ gateway_user_id }}"
      object_id: "{{ gateway_org_id }}"
    status_code: 201
  when: _role_assignment_get.json.count == 0

# --- Wait for the gateway to federate the org/user down to Controller's own API ----------
- name: "{{ item }} / wait for the Organization to federate to Controller"
  ansible.builtin.uri:
    url: "{{ controller_api }}/organizations/?name={{ item | urlencode }}"
    url_username: "{{ aap_admin_username }}"
    url_password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
  register: _ctrl_org_get
  until: _ctrl_org_get.json.count > 0
  retries: 12
  delay: 5

- name: "{{ item }} / set org_id (Controller's own id for this org)"
  ansible.builtin.set_fact:
    org_id: "{{ _ctrl_org_get.json.results[0].id }}"

- name: "{{ item }} / find SSH Machine credential"
  ansible.builtin.uri:
    url: "{{ controller_api }}/credentials/?name={{ 'VM SSH Key' | urlencode }}&organization={{ org_id }}"
    url_username: "{{ aap_admin_username }}"
    url_password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
  register: _ssh_cred_get

- name: "{{ item }} / create SSH Machine credential"
  ansible.builtin.uri:
    url: "{{ controller_api }}/credentials/"
    method: POST
    url_username: "{{ aap_admin_username }}"
    url_password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
    body_format: json
    body:
      name: "VM SSH Key"
      organization: "{{ org_id }}"
      credential_type: "{{ machine_credential_type_id }}"
      inputs:
        username: fedora
        ssh_key_data: "{{ aap_ssh_private_key }}"
    status_code: 201
  register: _ssh_cred_create
  no_log: true
  when: _ssh_cred_get.json.count == 0

- name: "{{ item }} / set ssh_cred_id"
  ansible.builtin.set_fact:
    ssh_cred_id: "{{ _ssh_cred_get.json.results[0].id if _ssh_cred_get.json.count > 0 else _ssh_cred_create.json.id }}"

- name: "{{ item }} / find OpenShift Bearer Token credential"
  ansible.builtin.uri:
    url: "{{ controller_api }}/credentials/?name={{ 'OpenShift Access' | urlencode }}&organization={{ org_id }}"
    url_username: "{{ aap_admin_username }}"
    url_password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
  register: _k8s_cred_get

- name: "{{ item }} / create/update OpenShift Bearer Token credential"
  ansible.builtin.uri:
    url: >-
      {{ controller_api }}/credentials/{{ _k8s_cred_get.json.results[0].id ~ '/' if _k8s_cred_get.json.count > 0 else '' }}
    method: "{{ 'PATCH' if _k8s_cred_get.json.count > 0 else 'POST' }}"
    url_username: "{{ aap_admin_username }}"
    url_password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
    body_format: json
    body:
      name: "OpenShift Access"
      organization: "{{ org_id }}"
      credential_type: "{{ k8s_credential_type_id }}"
      inputs:
        host: "{{ ocp_api_server.stdout }}"
        bearer_token: "{{ ocp_user_token_map[item] }}"
        verify_ssl: false
    status_code: [200, 201]
  register: _k8s_cred_upsert
  no_log: true

- name: "{{ item }} / set k8s_cred_id"
  ansible.builtin.set_fact:
    k8s_cred_id: "{{ _k8s_cred_upsert.json.id }}"

# --- That's it -- Project, Inventory (+ Source), and Job Template are built by the
# attendee in Module 8, referencing the "VM SSH Key" and "OpenShift Access" credentials
# above by name. See content/modules/ROOT/pages/module-08-aap.adoc.
